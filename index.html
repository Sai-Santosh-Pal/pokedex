<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokedex</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P" rel="stylesheet">
</head>
<body class="items-center py-5 justify-center flex bg-[#640514] h-screen">
    <div class="pokedex border-[0.1px] bg-[#DD092D] w-[100%] max-w-[490px] h-[100%]">
        <div class="upper polygon flex items-center w-full bg-[#C10929] h-[15%]">
            <div onclick="blueClick(5)" id="blue-light" class="pixel cursor-pointer ml-10 h-20 w-20 bg-[#23abfa] border-5 border-[#DEDEDE]/50 rounded-[1000px]"></div>
            <div class="lights flex gap-5 ml-53 mb-5">
                <div onclick="redFlicker(3)" id="red-light" class="pixel cursor-pointer w-8 h-8 bg-[#DD092D]/60 rounded-[100px]"></div>
                <div onclick="yellowFlicker(3)" id="yellow-light" class="pixel cursor-pointer w-8 h-8 bg-[#F5E851]/60 rounded-[100px]"></div>
                <div onclick="greenFlicker(3)" id="green-light" class="pixel cursor-pointer w-8 h-8 bg-[#5AA861]/60 rounded-[100px]"></div>
            </div>
        </div>
        <div class="main-screen flex items-center justify-center mt-10 w-[100%] h-[35%]">
            <div class="screen-container w-[100%] p-10 flex items-center justify-center">
                <div class="screen flex items-center gap-5 justify-center flex-col w-[80%] py-10 h-[80
            %] bg-[#9bbc0f]">
                <div class="img-container">
                    <img src="assets/img.jpeg" class="gameboy-filter">
                    <svg width="0" height="0" style="position:absolute" aria-hidden="true">
                        <filter id="gb" color-interpolation-filters="sRGB">
                            <feColorMatrix type="matrix" values="
                            0.299 0.587 0.114 0 0
                            0.299 0.587 0.114 0 0
                            0.299 0.587 0.114 0 0
                            0     0     0     1 0"/>
                            <feComponentTransfer>
                            <feFuncR type="discrete" tableValues="0.059 0.188 0.545 0.608"/>
                            <feFuncG type="discrete" tableValues="0.220 0.384 0.675 0.737"/>
                            <feFuncB type="discrete" tableValues="0.059 0.384 0.059 0.059"/>
                            </feComponentTransfer>
                        </filter>
                    </svg>
                </div>
                <div class="text-center">
                    <p class="text-xl font-bold">sai</p>
                    <p class="text-[10px] italic">coding lover</p>
                </div>
                </div>
            </div>
        </div>
    </div>
    <script src="index.js"></script>
</body>
<style>
    *{
        font-family: 'Press Start 2P';
    }
    .img-container {
        user-select: none;
    }
    .screen > div > p::selection {
        background: #5b6d09
    }
    *::selection{
        background: #640514;
        color: white;
    }
    .polygon {
        clip-path: polygon(0 0, 100% 0, 100% 70%, 60% 70%, 45% 100%, 0% 100%);
    }

    .screen {
        clip-path: polygon(100% 0, 100% 100%, 13% 100%, 0 84%, 0 0);
        pointer-events: none;
    }

    .img-container {
        --cell: 2px;
        position: relative;
        display: inline-block;
        line-height: 0;
        overflow: hidden;
        border-radius: 0px;
        isolation: isolate;
        pointer-events: none;
    }

    .gameboy-filter {
        pointer-events: none;
        display: block;
        image-rendering: pixelated;
        filter: contrast(1.5) brightness(1.1) url(#gb);
        max-width: 100%;

    }

    .img-container::before{
        content: "";
        position: absolute;
        inset: 0;
        background: #0f380f;
        mix-blend-mode: lighten;
        pointer-events: none;
    }

    .img-container::after {
        content: "";
        position: absolute;
        inset: 0;
        pointer-events: none;
        mix-blend-mode: darken;
          background:
    radial-gradient(ellipse at center, transparent 55%, rgba(15, 56, 15, .45) 100%),
    repeating-linear-gradient(0deg,  rgba(15, 56, 15, .25) 0 1px, transparent 1px var(--cell)),
    repeating-linear-gradient(90deg, rgba(15, 56, 15, .25) 0 1px, transparent 1px var(--cell)),
    #9bbc0f;
}
</style>
</html>
